<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-13d8e993-daee-46a8-821d-891a801dbb61/styles.css">
<script src="_ds/modernist-13d8e993-daee-46a8-821d-891a801dbb61/_ds_bundle.js"></script>
</helmet>
<header style="display:flex;align-items:stretch;justify-content:space-between;background:#ffffff;border-bottom:2px solid #0e1c3d;font-family:Archivo,system-ui,sans-serif">
  <div style="display:flex;align-items:center;gap:36px;padding:0 28px">
    <div style="display:flex;align-items:center;gap:10px;padding:16px 0">
      <div style="width:26px;height:26px;background:#0e1c3d;display:grid;place-items:center">
        <div style="width:8px;height:8px;background:#dd2b0f"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:1px">
        <span style="font:700 13px/1 Archivo,sans-serif;letter-spacing:.14em;color:#0e1c3d">AI &amp; DS</span>
        <span style="font:400 9px/1 Archivo,sans-serif;letter-spacing:.1em;color:#7d7979;text-transform:uppercase">Department</span>
      </div>
    </div>
    <nav style="display:flex;align-items:center;gap:22px;align-self:stretch">
      <sc-for list="{{ items }}" as="item" hint-placeholder-count="8">
        <a href="#" style="display:flex;align-items:center;align-self:stretch;font:500 12.5px/1 Archivo,sans-serif;text-decoration:none;letter-spacing:.01em;white-space:nowrap;color:{{ item.color }};box-shadow:inset 0 -3px 0 {{ item.rule }}">{{ item.label }}</a>
      </sc-for>
    </nav>
  </div>
  <div style="display:flex;align-items:center;gap:10px;padding:0 28px">
    <sc-if value="{{ authed }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font:500 12px/1 Archivo,sans-serif;color:#605d5d">Aarav M.</span>
        <div style="width:30px;height:30px;background:#e4eaf4;border:1px solid #0e1c3d;display:grid;place-items:center;font:600 11px/1 Archivo,sans-serif;color:#0e1c3d">AM</div>
      </div>
    </sc-if>
    <sc-if value="{{ anon }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;align-items:center;gap:8px">
        <a href="#" style="padding:9px 14px;font:500 12px/1 Archivo,sans-serif;color:#0e1c3d;text-decoration:none;border:1px solid #bab6b6">Sign in</a>
        <a href="#" style="padding:9px 14px;font:600 12px/1 Archivo,sans-serif;color:#ffffff;text-decoration:none;background:#0e1c3d">Create account</a>
      </div>
    </sc-if>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:64},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;authed&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || "Dashboard";
    const labels = ["Dashboard","About","Events","Leaderboard","Achievements","Alumni","Posts","Question Bank"];
    const authed = !!this.props.authed;
    return {
      authed, anon: !authed,
      items: labels.map(l => ({
        label: l,
        color: l === active ? "#0e1c3d" : "#605d5d",
        rule: l === active ? "#dd2b0f" : "transparent"
      }))
    };
  }
}
</script>
</body>
</html>
